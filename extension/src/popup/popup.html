<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FormPilot</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; color: #15153d; background: #fff; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #ececf4; }
    header svg { width: 26px; height: 26px; }
    header strong { font-size: 15px; }
    header span { display: block; font-size: 12px; color: #5d5d80; }
    main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    p { margin: 0; }
    .muted { color: #5d5d80; font-size: 12.5px; }
    .status { padding: 10px 12px; border-radius: 10px; background: #f3f3fb; }
    .status.ok { background: #e7f6ee; color: #146c3a; }
    .error { color: #b42318; font-size: 12.5px; }
    button { font: inherit; cursor: pointer; border-radius: 9px; padding: 9px 12px; font-weight: 600; border: 1px solid transparent; }
    .primary { background: #0e0e62; color: #fff; }
    .primary:hover { background: #24247f; }
    .ghost { background: #fff; color: #0e0e62; border-color: #c9cdf2; }
    .ghost:hover { background: #eef1fd; }
    .link { background: none; border: 0; padding: 0; color: #0e0e62; text-decoration: underline; font-weight: 400; }
    label { display: flex; gap: 8px; align-items: center; }
    input[type=url] { width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid #c9c9dc; border-radius: 8px; }
    details summary { cursor: pointer; color: #5d5d80; font-size: 12.5px; }
    details > div { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
    footer { padding: 10px 16px; border-top: 1px solid #ececf4; font-size: 11.5px; color: #5d5d80; }
    button:focus-visible, input:focus-visible { outline: 2px solid #0e0e62; outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0e0e62"/><path d="M9 11h14M9 16h10M9 21h6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="21.5" cy="21" r="2.6" fill="#ffc72c"/></svg>
    <div><strong>FormPilot</strong><span>Build your profile once. Fill forms anywhere.</span></div>
  </header>
  <main id="main"><p class="muted">Loading…</p></main>
  <footer>FormPilot fills only what you approve and never submits a form.</footer>
  <script src="popup.js"></script>
</body>
</html>
